<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carta de Amor Virtual</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="card">
      <h1>Uma carta só para você 💜</h1>
      <p class="subtitle">Quando sentir saudade, volte aqui e leia novamente — cada palavra é um abraço do seu amorzinho.</p>

      <div class="controls">
        <button id="revealBtn">Mostrar carta ✨</button>
        <button id="resetBtn" class="ghost">Recomeçar</button>
      </div>

      <div id="letter" class="letter">Clique em "Mostrar carta" e descubra...</div>

      <div class="gallery" id="gallery">
        <h2>Nossos momentos em familia</h2>
        <div class="thumbnails">
          <img src="./img/barigui.jpeg" alt="Momento 1" data-full="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1400&q=80">
          <img src="./img/khonshu.jpeg" alt="Momento 2" data-full="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1400&q=80">
          <img src="./img/jardim.jpeg" alt="Momento 3" data-full="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=1400&q=80">
        </div>
        <p class="hint">Cada momento com você é um presente.</p>
      </div>

      <div class="signature" id="signature"></div>
      <p class="footer-note">Para minha sagezinha 💕</p>

      <div class="hearts" id="hearts"></div>
    </div>
  </div>

  <script src="script.js"></script>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Fechar">&times;</button>
    <img src="" alt="" class="lb-image">
    <div class="lb-caption"></div>
  </div>
</body>

</html>
